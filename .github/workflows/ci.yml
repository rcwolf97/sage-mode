name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build:check
      # npm test, not a hand-inlined subset — an earlier version of this
      # workflow ran only `test/*.test.js`, silently excluding
      # `lib/**/*.test.js` (which is where the lint-floor regression tests
      # live). Keep this in sync with package.json's own "test" script
      # rather than re-listing globs here.
      - run: npm test
      - run: node lib/cli.js lint
      # Hook golden-payload suite — was never wired into CI at all. This is
      # what would have caught the original dash-vs-bash breakage (every
      # hook is `#!/usr/bin/env sh`, and dash — not bash — is `/bin/sh` on
      # ubuntu-latest) before it shipped.
      - run: npm run hooks:test
      # Tier-3 process-adherence evals — also never wired into CI. The suite
      # sat at "6 passed, 1 failed" for an unknown number of commits behind a
      # green badge, because nothing ran it: the failure was a bug in the
      # RUNNER (it parsed `review gate --json`'s { findings, rejected }
      # envelope as a bare array), asserting FAIL against a gate that was
      # correct the whole time. A red signal nobody looks at is the exact
      # shape architecture-v3 §8.7 forbids — "absence of proof is never proof
      # of absence" — so it runs here now, and `npm run verify` runs the same
      # five steps locally in the same order.
      #
      # evals/tier3/run.js is BUILD OUTPUT (tsconfig.json's `include` now
      # covers evals/tier3/**/*.ts). It used to be excluded, which is how the
      # .ts and the committed .js were free to drift apart unnoticed. Keep it
      # after `npm run build` so CI always evaluates freshly compiled code.
      - run: npm run eval:tier3
