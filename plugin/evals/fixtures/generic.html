<!doctype html>
<html><head><title>Generic</title>
<style>
body{font-family:system-ui,sans-serif}
.hero{text-align:center;padding:96px 24px;max-width:72rem;margin:0 auto}
.hero h1{font-size:48px}
.hero p{font-size:16px}
.btns{display:flex;gap:12px;justify-content:center}
.features{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;max-width:72rem;margin:0 auto;padding:96px 24px}
.icon{width:48px;height:48px;border-radius:999px;background:#7c3aed}
section{padding:96px 0}
.card{border-radius:16px;box-shadow:0 1px 2px #000}
</style></head>
<body>
<section class="hero">
  <h1>Transform your workflow</h1>
  <p>The all-in-one platform for modern teams.</p>
  <div class="btns"><button>Get started</button><button>Learn more</button></div>
</section>
<section class="features">
  <div class="card"><div class="icon"></div><h3>Fast</h3><p>Lorem ipsum.</p></div>
  <div class="card"><div class="icon"></div><h3>Secure</h3><p>Lorem ipsum.</p></div>
  <div class="card"><div class="icon"></div><h3>Simple</h3><p>Lorem ipsum.</p></div>
</section>
</body></html>
